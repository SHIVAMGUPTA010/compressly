    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = typeof _rawFetch === 'function' ? _rawFetch.bind(window) : _rawFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() {
                    return _currentFetch;
                  },
                  set: function(fn) {
                    _currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || '';
          var file = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          var isExtensionError =
            file.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('which has only a getter') !== -1;

          if (isExtensionError) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
